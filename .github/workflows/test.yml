name: Test

on:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run lint
        run: npm run lint
      - name: Run category tests
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_app
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: accounting_app
          DB_HOST: localhost
          DB_PORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: accounting_app
          PGHOST: localhost
          PGPORT: 5432
        run: npx jest tests/category.test.js --verbose --forceExit
