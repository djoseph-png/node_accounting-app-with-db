name: Test

on:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_app
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v2
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Install dependencies
        run: npm install
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h postgres -p 5432 -U postgres && echo "Postgres is ready!" && break
            echo "Waiting for postgres... attempt $i"
            sleep 2
          done
      - name: Run tests
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_app
          POSTGRES_HOST: postgres
          POSTGRES_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: accounting_app
          DB_HOST: postgres
          DB_PORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: accounting_app
          PGHOST: postgres
          PGPORT: 5432
        run: npm run lint
      - name: Run category tests
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_app
          POSTGRES_HOST: postgres
          POSTGRES_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: accounting_app
          DB_HOST: postgres
          DB_PORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: accounting_app
          PGHOST: postgres
          PGPORT: 5432
        run: npx jest tests/category.test.js --verbose
