name: Test

on:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: students
        # don't map ports in Actions, container is available on localhost
        options: >-
          --health-cmd="pg_isready -U postgres -d students -h localhost -p 5432"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install system deps (postgres client)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for postgres..."
          for i in $(seq 1 60); do
            if pg_isready -h localhost -p 5432 -U postgres -d students >/dev/null 2>&1; then
              echo "Postgres is ready"
              break
            fi
            echo "Waiting for postgres ($i/60)..."
            sleep 1
          done

      - name: Install dependencies
        run: npm install

      - name: Run tests
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: students
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          DATABASE_URL: postgres://postgres:password@localhost:5432/students
        run: npm test
